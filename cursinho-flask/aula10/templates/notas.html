<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Notas</title>
</head>
<body>
    <h1>boletim matemática</h1>
    <form action="/calculo" method="post">
        {% for x in range(4) %}
            <p>
                <input type="number" min="0" max="25" name="nota{{x}}" id="nota{{x}}" placeholder="nota {{x}}" required>
            </p>
        {% endfor %}
        <p>
            <button type="submit">Enviar</button>
        </p>
    </form>
</body>
</html>
